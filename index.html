<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>悖论告白 · 消失的心墙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #1a1f2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
            transition: background 0.5s ease;
        }

        /* 主容器 — 相对定位，用于切换内容 */
        .stage {
            max-width: 800px;
            width: 100%;
            position: relative;
            min-height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 第一个页面：诗意悖论卡片 */
        .page-paradox {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
            padding: 2rem 1.8rem 2.5rem;
            text-align: center;
            width: 100%;
            transition: opacity 0.5s cubic-bezier(0.2, 0.9, 0.6, 1.1), transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            transform: scale(1);
            opacity: 1;
        }

        /* 消失动画 —— 优雅淡出+缩小 */
        .page-paradox.hide {
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
            visibility: visible; /* 保证动画执行，但最终隐藏由过渡结束后移除或保留不可见 */
        }

        /* 三行文字区域，新增垂直优雅间距 */
        .triple-lines {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
            margin-bottom: 2.5rem;
        }

        .line-item {
            font-size: 1.9rem;
            font-weight: 570;
            letter-spacing: -0.01em;
            color: #f8e3cf;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            line-height: 1.3;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            backdrop-filter: blur(2px);
            transition: all 0.2s;
        }

        /* 三行不同的微装饰 */
        .line-item:nth-child(1) {
            border-left: 4px solid #f3a683;
            border-right: 4px solid #f3a683;
        }
        .line-item:nth-child(2) {
            border-left: 4px solid #f3cca6;
            border-right: 4px solid #f3cca6;
        }
        .line-item:nth-child(3) {
            border-left: 4px solid #e2b0ff;
            border-right: 4px solid #e2b0ff;
        }

        /* 装饰点阵 */
        .ornament-dots {
            margin: 1rem 0 1.5rem;
            display: flex;
            justify-content: center;
            gap: 0.7rem;
        }
        .ornament-dots span {
            width: 8px;
            height: 8px;
            background: #f3a683;
            border-radius: 50%;
            opacity: 0.5;
        }

        /* 按钮 */
        .reveal-btn {
            background: linear-gradient(135deg, #ff8c5a, #ff5e7e);
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255,255,240,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
            letter-spacing: 2px;
            width: 80%;
            max-width: 300px;
            margin-top: 0.5rem;
        }

        .reveal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, #ff7a42, #ff4b6e);
        }

        .reveal-btn:active {
            transform: translateY(2px);
        }

        /* 第二个页面：全屏感觉的视频容器（清空后显示） */
        .page-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2), visibility 0s linear 0.6s;
            box-shadow: 0 30px 40px -15px black;
            border: 1px solid rgba(255,255,200,0.25);
        }

        .page-video.show {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2), visibility 0s linear 0s;
        }

        .video-wrapper {
            width: 100%;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
            outline: none;
        }

        .video-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #e2c9b3;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* 响应式 */
        @media (max-width: 560px) {
            .line-item {
                font-size: 1.3rem;
                padding: 0.4rem 0.8rem;
            }
            .triple-lines {
                gap: 0.9rem;
            }
            .reveal-btn {
                font-size: 1.2rem;
                padding: 0.7rem 1.2rem;
            }
            .stage {
                min-height: 420px;
            }
        }

        footer {
            position: fixed;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #6e7a8f;
            pointer-events: none;
            background: transparent;
            z-index: 2;
        }

        /* 优雅隐藏第一页之后，让背景稍微变暗一点点更聚焦视频 */
        body.video-mode {
            background: linear-gradient(145deg, #03050b 0%, #11141f 100%);
        }
    </style>
</head>
<body>
<div class="stage">
    <!-- 第一个页面：三句悖论 分行显示 -->
    <div class="page-paradox" id="firstPage">
        <div class="triple-lines">
            <div class="line-item">「我喜欢你」</div>
            <div class="line-item">第一句是假的</div>
            <div class="line-item">上一句也是</div>
        </div>
        <div class="ornament-dots">
            <span></span><span></span><span></span><span></span>
        </div>
        <button class="reveal-btn" id="continueBtn">✦ 继 续 ✦</button>
    </div>

    <!-- 第二个页面：视频区 (初始隐藏) 播放时清空第一页并展现 -->
    <div class="page-video" id="videoPage">
        <div class="video-wrapper">
            <video id="confessionVideo" controls controlslist="nodownload" preload="metadata" playsinline>
                <!-- 视频路径与 BearBig.mp4 同一仓库根目录 -->
                <source src="BearBig.mp4" type="video/mp4">
                您的浏览器不支持视频播放，但真心不减 💗
            </video>
        </div>
        <div class="video-note">🎬 言语消融，此刻真实 🎬</div>
    </div>
</div>
<footer>谎言迷宫瓦解 · 按下继续 心证成真</footer>

<script>
    (function() {
        // 获取元素
        const firstPage = document.getElementById('firstPage');
        const videoPage = document.getElementById('videoPage');
        const continueBtn = document.getElementById('continueBtn');
        const videoElem = document.getElementById('confessionVideo');
        
        let isTransitioned = false;    // 确保只执行一次清空+播放流程
        
        // 优雅清空第一个页面并显示视频的核心函数
        function clearFirstPageAndPlayVideo() {
            if (isTransitioned) {
                // 如果已经执行过，再次点击时保证视频若暂停可继续播放，但不重复清空动画（因为第一页已经隐藏）
                if (videoElem && videoElem.paused) {
                    videoElem.play().catch(e => console.log("播放尝试:", e));
                }
                return;
            }
            
            // 标记已触发
            isTransitioned = true;
            
            // 1. 给第一页添加消失动画 (类 .hide)
            firstPage.classList.add('hide');
            
            // 2. 可选: 让body背景加深一点，增强视频沉浸感
            document.body.classList.add('video-mode');
            
            // 3. 等待淡出动画接近完成后 (约380ms) 显示视频页面并播放视频
            // 为了视觉流畅，延迟一点点同时显示video页面，确保第一页逐渐不可见后第二页优雅浮现
            setTimeout(() => {
                // 显示视频容器 (show class)
                videoPage.classList.add('show');
                
                // 同时强制加载/播放视频，由于用户刚刚点击按钮，拥有用户手势授权，可以自动播放。
                if (videoElem) {
                    // 重新加载确保资源就绪
                    videoElem.load();
                    const playPromise = videoElem.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // 极少数情况下自动播放受限（例如浏览器静音策略），但用户交互明确通常能播放。
                            // 如果失败，提示用户手动点击播放，但控件依然可见，不影响体验。
                            console.warn("自动播放受阻，可手动点击播放:", error);
                            const note = document.querySelector('.video-note');
                            if (note && !note.innerText.includes('点击播放')) {
                                note.innerHTML = "🎵 轻触视频即可播放 🎵";
                            }
                        });
                    }
                }
                
                // 额外附加：若视频加载失败或路径不对展示友好报错
                if (videoElem) {
                    videoElem.addEventListener('error', function onVideoError() {
                        const videoContainerNote = document.querySelector('.video-note');
                        if (videoContainerNote && !videoContainerNote.innerText.includes('BearBig.mp4')) {
                            videoContainerNote.innerHTML = "💔 未找到视频文件，请确保 BearBig.mp4 与网页在同目录下 💔";
                            videoContainerNote.style.color = "#ffbc9f";
                        }
                        // 防止重复监听
                        videoElem.removeEventListener('error', onVideoError);
                    });
                }
            }, 380);  // 与CSS过渡时间相仿，优雅切换
        }
        
        // 绑定按钮点击事件
        if (continueBtn) {
            continueBtn.addEventListener('click', (e) => {
                e.preventDefault();
                clearFirstPageAndPlayVideo();
                // 给按钮一点文字变化（但按钮即将消失，无需大动干戈，可以保留一些趣味）
                continueBtn.innerText = '✨ 心 证 开 启 ✨';
                setTimeout(() => {
                    if (continueBtn && !isTransitioned) {
                        // 防止二次修改不影响已经消失的情况，但无所谓
                    }
                }, 200);
            });
        }
        
        // 预备优雅的处理: 如果视频因为任何原因加载失败，不影响页面整洁
        // 另外，当视频播放完毕时，可以保留回味，不需要额外动作
        
        // 为了防止在第一次页面已经隐藏时再次误触导致重复显示逻辑，已经通过 isTransitioned 处理
        console.log('💗 悖论三行 · 按下继续后第一页将完全消失，视频承载真心。视频路径: BearBig.mp4');
    })();
</script>
</body>
</html>
